<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login OAuth - Projeto01</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 480px;
      margin: 4rem auto;
      padding: 0 1rem;
      color: #1a1a1a;
    }
    h1 {
      font-size: 1.4rem;
    }
    .card {
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 1.5rem;
      margin-top: 1.5rem;
    }
    .login-btn {
      display: block;
      text-align: center;
      padding: 0.75rem 1rem;
      margin-bottom: 0.75rem;
      border-radius: 6px;
      text-decoration: none;
      font-weight: 600;
      border: 1px solid #ccc;
      color: #1a1a1a;
    }
    .login-btn.google { background: #fff; }
    .login-btn.github { background: #24292f; color: #fff; border-color: #24292f; }
    .user-info p { margin: 0.25rem 0; }
    #logout-form button {
      margin-top: 1rem;
      padding: 0.5rem 1rem;
      border-radius: 6px;
      border: 1px solid #ccc;
      background: #f5f5f5;
      cursor: pointer;
    }
    #status { color: #666; font-size: 0.9rem; }
  </style>
</head>
<body>
  <h1>Laboratorio: login OAuth em site estatico no Cloudflare Pages</h1>

  <div class="card">
    <p id="status">Verificando sessao...</p>

    <div id="logged-out" hidden>
      <a class="login-btn google" href="/oauth/login/google">Entrar com Google</a>
      <a class="login-btn github" href="/oauth/login/github">Entrar com GitHub</a>
    </div>

    <div id="logged-in" class="user-info" hidden>
      <p><strong>Autenticado via:</strong> <span id="user-issuer"></span></p>
      <p><strong>Nome:</strong> <span id="user-name"></span></p>
      <p><strong>E-mail:</strong> <span id="user-email"></span></p>

      <form id="logout-form" method="POST" action="/oauth/logout">
        <button type="submit">Sair</button>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
